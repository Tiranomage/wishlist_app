version: '3.8'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: wishlist_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wishlist_db
    command: [
      "sh", "-c",
      "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    ]

  frontend:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
    command: [
      "streamlit", "run", "streamlit_frontend.py",
      "--server.address", "0.0.0.0",
      "--server.port", "8501",
      "--browser.gatherUsageStats", "false"
    ]

volumes:
  postgres_data: